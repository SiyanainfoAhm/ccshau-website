# Daily off-site backup verification + Storage inventory
# Complements Supabase Pro managed daily DB backups.
# Docs: docs/ops/backup-restore-guide.md

name: Daily Supabase Backup

on:
  schedule:
    # ~08:00 IST
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install app dependencies (supabase-js)
        working-directory: apps/web
        run: npm ci

      - name: Verify managed daily backups
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: fvveqziyusjgqejowkfp
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret not set — skipping Management API verify."
            echo "Dashboard: Database → Backups → Scheduled (Pro plan = automatic daily backups)."
            exit 0
          fi
          node scripts/ops/verify-supabase-backups.mjs

      - name: Storage inventory (metadata backup)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Storage secrets not set — skipping inventory."
            exit 0
          fi
          node scripts/ops/backup-storage.mjs

      - name: Upload storage inventory artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storage-inventory-${{ github.run_id }}
          path: backups/storage/
          if-no-files-found: ignore
          retention-days: 14

  logical-db-dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump database (logical off-site copy)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_DB_PASSWORD / SUPABASE_ACCESS_TOKEN not set — skipping logical dump."
            exit 0
          fi
          mkdir -p backups/db
          supabase link --project-ref fvveqziyusjgqejowkfp -p "$SUPABASE_DB_PASSWORD"
          supabase db dump -f "backups/db/ccshau-$(date -u +%Y%m%d).sql"

      - name: Upload DB dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-dump-${{ github.run_id }}
          path: backups/db/
          if-no-files-found: ignore
          retention-days: 7
