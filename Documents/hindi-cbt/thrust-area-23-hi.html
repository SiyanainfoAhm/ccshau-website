<p><strong>प्रमुख कार्य क्षेत्र</strong></p>
<ul>
<li>कंप्यूटर-सहायित औषधि अभिकल्पन — लिगैंड एवं रिसेप्टर आधारित अंतःक्रियाएँ</li>
<li>फसल पौधों के विशेष संदर्भ में डेटाबेस से ज्ञान खोज</li>
<li>प्रोटीन इंजीनियरिंग — संरचनात्मक मॉडलिंग एवं अंतःक्रियाएँ</li>
<li>संरचनात्मक एवं कार्यात्मक जीनोमिक्स तथा प्रोटिओमिक्स</li>
</ul>
