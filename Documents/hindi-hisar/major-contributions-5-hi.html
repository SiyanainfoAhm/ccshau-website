<p><strong>प्रमुख योगदान</strong></p>
<ul>
<li>विभिन्न क्षेत्रों के लिए उपयुक्त फल फसलों हेतु सिफारिशें जारी की गईं।</li>
<li>प्रवर्धन, गुणवत्ता, मृदा, उर्वरक, सुधार और पादप संरक्षण सहित पैकेज ऑफ प्रैक्टिसेज विकसित किए गए।</li>
<li>उद्यान फसलों के उत्पादन और उत्पादकता सुधार हेतु अनुसंधान एवं विस्तार योगदान दिए गए।</li>
</ul>
